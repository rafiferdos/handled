name: Validate workspace

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Use the approved package manager
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - name: Install the frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Lint, types, unit tests and production builds
        run: pnpm check
      - name: Preserved API HTTP and contract regressions
        run: pnpm --filter handled-api test:e2e
      - name: Install Chromium
        run: pnpm --filter @handled/web exec playwright install --with-deps chromium
      - name: Production frontend smoke tests
        run: pnpm test:e2e
